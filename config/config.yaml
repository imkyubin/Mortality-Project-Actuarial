age_handling:
  primary_model_ages: 20-84
  younger_ages: Keep available in raw/cleaned data if present, but exclude from the first primary model.
  older_ages: Exclude from rate-based models when population exposure is missing.
  not_stated_age: Exclude from age-specific models and track in validation notes.

quality_bar:
  description: Criteria for making the project strong enough for a prestigious actuarial/data science review.
  engineering_hygiene:
    requirement: The repo is usable and legible to an outside reviewer, not just runnable by the author.
    status: gap
    evidence_needed:
      - Populated requirements.txt (currently empty).
      - Populated README.md (currently empty) explaining what the project is, how to run it, and what is done versus planned.
      - Unit tests for life table invariants and other pure-function logic (tests/ currently empty).
      - Incremental, meaningfully-messaged git commit history rather than one large drop.
  end_to_end_run:
    requirement: The project runs from raw CDC WONDER data to final outputs with one command.
    status: planned
    evidence_needed:
      - Reproducible command documented in README.
      - Raw-to-cleaned data pipeline.
      - Model fitting outputs.
      - Dashboard exports.
      - Final report or memo generated from saved model results.
  lee_carter_benchmark:
    requirement: Lee-Carter output is compared against a published benchmark when using comparable data.
    status: planned
    benchmark_source: Human Mortality Database US Lee-Carter or equivalent published mortality benchmark.
    evidence_needed:
      - Document data differences before comparison.
      - Compare ax, bx, and kt where definitions align.
      - Define reasonable tolerance.
      - Explain any material mismatch.
  kt_uncertainty:
    requirement: kt forecasts include correct uncertainty intervals.
    status: planned
    method: Random walk with drift using estimated drift variance.
    evidence_needed:
      - Symmetric intervals around forecast kt.
      - Intervals widen with forecast horizon.
      - Formula documented in forecasting module or report.
  out_of_sample_backtest:
    requirement: The model's forecast is validated against real holdout data, not just in-sample fit diagnostics.
    status: planned
    method: Fit Lee-Carter/Poisson Lee-Carter on a training window (e.g., 1999-2018), forecast kt forward via random walk with drift, convert to forecast mortality rates, and compare against actual observed mortality in the holdout years (2019-2024).
    evidence_needed:
      - Plot or table of forecasted vs actual mx (or ex) for the holdout years, by age and/or sex.
      - Explicit discussion of where the forecast diverges from actual (e.g., COVID-19 2020-2021 should show a real, expected divergence, not be treated as a bug to fix).
      - Feeds validation_failure_mode as one of the concrete documented failure modes.
  actuarial_memo:
    requirement: At least one output is formatted as a one-page actuarial-style memo.
    status: planned
    required_sections:
      - Purpose and scope.
      - Data and assumptions.
      - Methods.
      - Key results.
      - Limitations.
      - Reliance statement.
      - Actuarial review note.
  ai_review_gate:
    requirement: AI-generated interpretation is explicitly marked as requiring human actuarial review.
    status: planned
    required_language: AI-generated interpretation - actuarial review required before client or external use.
    implementation_note: Enforced by ai_reporting.guardrail.
  validation_failure_mode:
    requirement: Validation includes at least one place where the model performs poorly and explains why.
    status: planned
    candidate_failure_modes:
      - Lee-Carter may perform poorly for young adult mortality affected by drug-induced deaths or external causes.
      - CDC WONDER suppression of small death counts can silently break the life table for a year/sex group if not explicitly handled; see data.known_data_quality_risk.
    evidence_needed:
      - Residual plot or error metric showing poor fit.
      - Plain-English diagnosis.
      - Proposed structural fix, such as cause-specific modeling, age segmentation, or cohort/period shock adjustment.

life_table:
  radix: 100000
  qx_method: deaths_divided_by_population
  final_age: 84

modeling:
  main_model: lee_carter
  secondary_model: poisson_lee_carter
  forecast_horizon_years: 10

reporting:
  default_output: reports/mortality_model_report.md
  ai_generated_commentary: See ai_reporting for the grounded/RAG pipeline that produces the subsection-level narrative used in both this report and the dashboard.
