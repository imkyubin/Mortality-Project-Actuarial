project:
  name: mortality_cdc_wonder
  version: 0.2.0
  description: CDC WONDER mortality modeling portfolio project.
  resume_goal: Entry-level/intern actuarial portfolio piece demonstrating life table construction, mortality modeling (Lee-Carter family), data engineering, dashboarding, API design, and applied AI engineering with grounded/RAG-based reporting.

data:
  modern_single_age_file: data/processed/new_1999_2024.csv
  harmonized_file: data/processed/harmonized_1968-2024.csv
  processed_file: data/processed/new_1999_2024.csv
  output_dir: data/outputs
  status: raw_to_processed_pipeline_done
  known_data_quality_risk: CDC WONDER suppresses death counts under 10 as the literal string "Suppressed". src/data/cleaning.py:flag_suppressed now flags this explicitly (adds a `{column} Suppressed` boolean column, e.g. `Deaths Suppressed`) before pd.to_numeric(errors="coerce") turns it into an indistinguishable NaN downstream; wired into scripts/data_cleaning_exploration.py right after combine_datasets, so both processed files (old_1968_1998.csv, new_1999_2024.csv) now carry the flag (currently all-False, since national all-cause single-age counts don't hit the under-10 threshold — this matters once the state/cause/race pull in data_collection_strategy.resolved_decision lands, where it will). Known related gap, not yet fixed — src/data/harmonization.py's aggregate() does a plain 'sum' on Deaths (unlike Population, which already numeric-coerces via sum_or_cat_rule first) and doesn't propagate the Suppressed flag through the groupby — if a suppressed cell ever reaches that function, it would either silently string-concatenate or silently undercount an aggregated bucket rather than flag it. Not currently triggered (harmonization.py only processes the national all-cause single-age data, which the state/cause/race pull is explicitly kept separate from per data_collection_strategy.resolved_decision.scope), but should be fixed before harmonization.py ever runs on data that can be suppressed.

excel_reference:
  workflow_doc: Phase1_Hands_On/Excel/Mortality Table Project Workflow.docx
  workbook: Phase1_Hands_On/Excel/Mortality_Workbook.xlsx
  purpose: Use the Excel workbook as the validation reference for formulas, charts, dashboard metrics, and first modeling examples.
  python_data_source_note: Recreate the Excel workflow from data/processed/new_1999_2024.csv instead of importing the workbook's manually exported CDC WONDER CSV.
  validation_depth: Spot-check one age/sex/year combination against the workbook, not a full reconciliation table. See workflow.step_1_baseline_model_prototype.

outputs:
  tables_dir: data/outputs/tables
  figures_dir: data/outputs/figures
  validation_dir: data/outputs/validation
  models_dir: data/outputs/models
  reports_dir: reports
  report_figures_dir: reports/figures
  status: folders_created_pending_use

current_scope:
  description: Initial Python validation scope matching the Excel workbook, filtered from the processed modern single-age dataset.
  years:
    start: 2015
    end: 2020
  ages:
    min: 20
    max: 84
  sex:
    - Female
    - Male
    - Total
  location:
    - United States
  cause_of_death:
    - All causes

workflow:
  step_1_baseline_model_prototype:
    status: core_logic_complete_in_script_not_yet_refactored
    implementation: scripts/step1_baseline_model_prototype.py
    description: Prototype the full actuarial workflow end-to-end (life table, graduation methods, Lee-Carter, and kt forecast) on a small validation slice before scaling to the full modern dataset in step 2 and the harmonized long history in step 3. Originally framed as pure Excel validation; that is now a minor spot-check rather than the point of this step.
    input_source: data/processed/new_1999_2024.csv
    source_dataset: modern_single_age_file
    filter_rule: Select the workbook validation years and age range from the processed 1999-2024 single-age file instead of importing the manually exported CDC WONDER workbook CSV.
    output_goal: Spot-check qx, px, lx, dx, Lx, Tx, and ex for one age/sex/year against the Excel/reference outputs rather than a full reconciliation; project priority has shifted to the dashboard, API, and LLM-supported reporting layers.
    next_action: Extract the validated functions into src/actuarial/ (life_table.py, graduation.py, lee_carter.py, forecasting.py) so step 2 and step 3 reuse them instead of copy-pasting this script.
    years:
      start: 2015
      end: 2020
    age_basis: single_year_age
    ages:
      min: 20
      max: 84
    life_table_build:
      cleanup_steps:
        - Treat blank sex values as Total when reproducing the original workbook logic.
        - Keep Year Code, Single-Year Ages Code, Sex Code, Deaths, and Population.
        - Filter to ages 20-84 because age 85+ lacks population exposure.
        - Sort by year, sex, and increasing age before recursive life table calculations.
      life_table_columns:
        qx: Deaths divided by Population.
        px: 1 minus qx.
        lx: Recursive surviving cohort count with l20 equal to the radix.
        dx: qx times lx.
        Lx: lx minus 0.5 times dx, assuming deaths are uniformly distributed within each age interval.
        Tx: Backward recursive sum of Lx from current age through age 84.
        ex: Tx divided by lx.
        cumulative_survival: lx divided by radix.
      validation_outputs:
        - Cleaned validation table for years 2015-2020 and ages 20-84.
        - Life table columns matching the Excel workbook formulas.
        - Spot-check qx, lx, and ex for one age/sex/year combination against the Excel workbook; a full comparison table across all years/ages/sexes is deprioritized, not required to consider step 1 complete.
      visualization_outputs:
        - qx line graph by age and sex.
        - log qx or log mx line graph by age and sex.
        - survival curve by age and sex.
        - life expectancy ex line graph by age and sex.
        - death rate distribution.
    modeling_prototype:
      starting_model_scope:
        year: 2019
        sex: Female
        rationale: Use a pre-COVID year for the first model example, matching the Excel workflow.
      modeling_sequence:
        - Gompertz model on ln(mx) versus age.
        - Residual plot for observed mx versus fitted Gompertz mx.
        - Moving average graduation using 3-year and 5-year age windows.
        - Mortality improvement tables by year and sex.
        - Makeham model using nonlinear least squares.
        - Whittaker-Henderson graduation using a second-difference roughness penalty.
        - Lee-Carter model using ln(mx) = ax + bx * kt + error.
      forecast_sequence:
        - Calculate delta kt by year.
        - Estimate drift as the mean delta kt.
        - Estimate kt residual standard deviation.
        - Forecast kt with widening confidence intervals.
        - Convert forecast kt back to forecast mortality rates.

  step_2_modern_single_age_model:
    status: in_progress
    status_note: whittaker_henderson_utility below is done and eda is in progress; lee_carter_utility below (SVD-based fit, fit diagnostics, A/E validation, historical e-at-age comparison) is in progress. poisson_lee_carter.py and forecasting.py are still stub files.
    description: The primary, production-quality mortality model. Unlike step 1's deliberately exhaustive prototype toolbox, step 2 intentionally uses only the small set of models an actuary would actually rely on in practice, fit on the full modern single-age dataset.
    input_source: data/processed/new_1999_2024.csv
    source_dataset: modern_single_age_file
    years:
      start: 1999
      end: 2024
    age_basis: single_year_age
    ages:
      min: 20
      max: 84
    models:
      - lee_carter
      - poisson_lee_carter
    model_selection_rationale: Lee-Carter and Poisson Lee-Carter are the two models genuinely used in real-world mortality and longevity work; Poisson Lee-Carter is the correct refinement because it fits deaths as counts against population exposure instead of only pre-smoothed rates. Deliberately excludes step 1's wider toolbox (Gompertz, Makeham, moving-average, Whittaker-Henderson) as this step's headline model, though those remain available as graduation/smoothing utilities where useful.
    engineering_tasks:
      - Handle CDC WONDER suppressed-cell values explicitly (see data.known_data_quality_risk) before fitting; do not let them silently propagate through the life table.
      - Extract and reuse validated logic from scripts/step1_baseline_model_prototype.py into src/actuarial/ instead of duplicating it in a new script.
      - Add unit tests for life table invariants (l0 equals radix, lx non-increasing with age, Tx at the final age equals Lx at the final age).
    validation:
      lee_carter_benchmark: Compare ax, bx, and kt against the Human Mortality Database US Lee-Carter output or an equivalent published benchmark; document data differences and define a tolerance before comparing. See quality_bar.lee_carter_benchmark.
      kt_uncertainty: Random walk with drift; forecast intervals must widen with horizon. See quality_bar.kt_uncertainty.
      out_of_sample_backtest: Fit on a training window (e.g., 1999-2018), forecast kt forward, convert to forecast mortality rates, and compare against actual observed rates in the holdout years (2019-2024). See quality_bar.out_of_sample_backtest.
    use_case: Primary detailed age-specific mortality modeling and forecasting; the model that the dashboard, API, and LLM reporting layers read from.
    whittaker_henderson_utility:
      status: done
      location: src/actuarial/whittaker_henderson.py
      purpose: Reusable Whittaker-Henderson graduation/smoothing utility per model_selection_rationale above (not the step 2 headline model). Extends step 1's single hand-picked year/sex slice into a fit across every year/sex group in the full modern dataset.
      function_list:
        - "_second_difference_matrix(n): roughness-penalty matrix, reused by fit_whittaker_henderson and by the lambda elbow's smoothness term."
        - "fit_whittaker_henderson(df, year, sex_code, lambda_=1, pop_weights='n'): single year/sex fit; the shared building block everything else calls. pop_weights uses population SHARE (Population/Population.sum() within that slice), not raw population counts, so lambda_'s effective meaning doesn't swing wildly between pop_weights='n' and population-weighted."
        - "fit_wh_all(df, lambda_=1, pop_weights='n'): fits every (Year Code, Sex Code) group and concatenates into one long frame; the actual step 2 entry point."
        - "lambda_metrics(df, lambda_grid, pop_weights='n') / plot_lambda_elbow(lambda_df): sweeps lambda_grid across the whole dataset (not one slice) via fit_wh_all, builds a (Lambda, RSS, Smoothness) table, plots the elbow with each point labeled by lambda. RSS is also population-share weighted for the same reason as above."
        - "wh_heatmap(df, sex_code): Year x Age residual heatmap, one call per sex, TwoSlopeNorm(vcenter=0) + diverging colormap. Replaces a per-slice residual line plot across the full 1999-2024 range."
        - "plot_whittaker_fit(whittaker_df): single-slice observed-vs-fitted curve; kept for spot-checking one fit's actual shape."
        - "wh_worst_fit(whittaker_df, n=10, pop_weights='n') / wh_worst_cumdev(whittaker_df, n=10, pop_weights='n'): rank every (Year Code, Sex Code) group by population-share-weighted RSS or by max absolute cumulative deviation, returning the top n as a ranking table. plot_3worst_fit(top_df, whittaker_df, top_k=3) plots the top top_k of whichever ranking table it's given, reusing plot_whittaker_fit per slice."
      superseded_plan:
        - "The originally-planned single-slice plot_cumulative_deviations was never built. Once it became clear manually picking one slice at a time didn't scale to the full dataset, it was replaced by the wh_worst_fit/wh_worst_cumdev ranking layer plus plot_3worst_fit, which automatically selects and plots the worst-fit/most-biased slices instead."
      removed:
        - "plot_whittaker_residual: superseded by the wh_worst_cumdev ranking (directional bias, automatically applied to the worst offenders) rather than a raw single-slice residual scatter."
      resolved_decisions:
        - "Whether lambda_ is fixed across all year/sex groups or allowed to vary per group: resolved as fixed/global — lambda_metrics/plot_lambda_elbow deliberately fit the whole dataset at each candidate lambda_ rather than per-slice, matching how a real graduation table uses one smoothing constant per basis, not one per subgroup."
        - "Population-weight scaling: resolved by normalizing to population share (divide by that slice's own Population.sum()) everywhere pop_weights is used — in the fit itself and in the ranking metrics — rather than raw population counts, which would otherwise both distort cross-group rankings toward high-population groups and change lambda_'s effective meaning depending on pop_weights."
      next_up: scripts/step2_all_dataset_model.py wires this module (and the eda module below) together end to end and is the working reference for how these functions compose.
    lee_carter_utility:
      status: in_progress
      location: src/actuarial/lee_carter.py
      purpose: SVD-based Lee-Carter fit (ln(mx) = ax + bx*kt), fit diagnostics, and an Actual/Expected (A/E) validation layer against the fitted mx surface. This is the working, non-forecasting half of the step 2 headline model; poisson_lee_carter.py (the Newton-Raphson MLE refinement) and forecasting.py remain stub files.
      function_list:
        - "lc_matrix(df, sex_code): pivots ln(qx) into a Year x Age matrix for one sex; the shared input to fit_lee_carter and lc_variance_explained."
        - "fit_lee_carter(matrix): SVD-based ax/bx/kt fit; ax is the per-age mean, bx/kt come from the first singular vector/value pair, rescaled so bx sums to 1."
        - "reconstruct_lc(ax, bx, kt): rebuilds the fitted ln(mx) surface from the fitted parameters."
        - "build_lc_tables(...) / fit_lc_all(df): wraps the fit per Sex Code group into long age/year/fitted tables across the whole dataset; the actual step 2 entry point."
        - "plot_lc_parameters(age_all, year_all): fit sanity-check — ax and bx vs age, kt vs year, one figure per parameter per sex. Placed immediately after fit_lc_all in the module, ahead of the A/E functions below, since those numbers shouldn't be trusted until this has been reviewed."
        - "lc_variance_explained(matrix): reruns the SVD on the same centered matrix fit_lee_carter uses and returns per-component variance-explained (S**2/sum(S**2)) plus cumulative variance, to check how much the single-component Lee-Carter approximation is actually capturing."
        - "ae_metric(df, fitted_all): merges fitted_all onto df to compute Expected Deaths (Population * fitted_mx), AE Ratio, and AE Deviation."
        - "ae_heatmap(ae_df): Year x Age heatmap of (AE Ratio - 1) per sex, TwoSlopeNorm(vcenter=0) + RdBu_r, reusing the wh_heatmap diagnostic pattern above."
        - "ae_summary(ae_df): prints population-aggregated AE Ratio per Year/Sex (sums Deaths and Expected Deaths separately before dividing, rather than averaging per-cell ratios)."
        - "ex_progression_plot(single_age_life_table, ae_df, age=65): builds a life table off the fitted Expected Deaths via add_life_tab_col (src/actuarial/life_table.py), then plots fitted ex against actual ex at a given age, one figure per sex; the historical (non-forecast) e-at-age comparison."
      not_yet_built:
        - "Newton-Raphson-calibrated Poisson Lee-Carter kt: a prior session reportedly built this, but it does not exist in this repo or its git history — it was lost in an unsaved session. Treat as not yet done."
        - "forecasting.py (kt drift/forecast, fan charts): depends on either the SVD-based or Poisson-calibrated kt being treated as final first."
      next_up: poisson_lee_carter.py is still an empty stub; forecasting.py follows once one of the two kt fits is treated as primary.
    eda:
      status: in_progress
      location: src/actuarial/eda.py (planned location was src/eda/; ended up colocated with the other actuarial modules since it needs the same life-table columns)
      distinction_from_visualization: Deliberately kept separate from src/visualization/ (dashboard/export-ready plots). EDA here serves the analyst's own diagnostic understanding and is not necessarily end-user-facing.
      built:
        - "plot_crude_mortality_surface(df, sex_code): raw (pre-graduation) ln(qx) mortality surface, Year x Age, sequential (not diverging) colormap since ln(qx) has no meaningful zero to center on."
        - "plot_progression_eda(df, sex_code, column, start_year=None, gaps=1): mortality curve (column='ln_qx') or survival curve (column='Cumulative Survival') by age, one line per year (thinned via start_year/gaps); handles both single-year and harmonized age bases."
        - "top_n_ex(df, sex_code, df_n=5) / plot_top_ex(df, sex_code, plot_n=3): ranks ages by the slope of their life-expectancy trend over time (np.polyfit), returns/plots the most-improving and most-declining ages automatically rather than requiring a manually picked age."
        - "pct_change_qx(df, sex_code) / plot_pct_heatmap(df, sex_code): year-over-year percent mortality-improvement rate (sign-flipped so positive means improving), pivoted Year x Age, TwoSlopeNorm(vcenter=0) + diverging colormap since improvement is genuinely a positive/negative quantity."
      not_yet_built:
        - "Missingness/suppression heatmap (Year x Age, faceted by sex): flags where Deaths/Population came back NaN after pd.to_numeric(errors='coerce'). Recommended to build first — directly targets data.known_data_quality_risk before any modeling trusts the life table recursion, since one suppressed cell can silently corrupt an entire year/sex group's lx via the cumulative product. Still outstanding; the other plots were built ahead of it in practice."
        - "Sex mortality gap: male vs female qx or ex by age, a well-documented actuarial pattern worth confirming in this dataset."
      dashboard_facing: Life expectancy trend (top_n_ex/plot_top_ex), survival curve and mortality curve (plot_progression_eda), and the mortality improvement heatmap are candidates for dashboard_strategy panels — interpretable to a general viewer under the year/sex/age filters.
      internal_only: The missingness/suppression heatmap (once built) and raw death-count distributions belong in the analyst's own workflow and the actuarial_memo's limitations section, not as live dashboard panels. plot_crude_mortality_surface and wh_heatmap-style residual heatmaps are model-diagnostic tools, not headline dashboard content.

  step_3_holistic_harmonized_model:
    status: planned_after_step_2
    priority_note: Lower priority than the dashboard, API, and LLM reporting layers. Build only if time remains after step 2 and the application layer are done.
    description: Long historical model using harmonized CDC age groups.
    input_source: data/processed/harmonized_1968-2024.csv
    source_dataset: harmonized_file
    years:
      start: 1968
      end: 2024
    age_basis: harmonized_grouped_age
    harmonization_rule: Aggregate modern single-year ages to match the older CDC grouped-age structure before fitting models.
    models:
      - lee_carter
      - poisson_lee_carter
    use_case: Long-run mortality trend comparison with reduced age detail; general historic trend visualization only. Not used for the state/cause subsection comparison scope in future_reporting_parameters — that scope is restricted to the single-age (1999-2024) dataset, since combining both eras for that level of stratified analysis was judged too complicated relative to the benefit. See data_collection_strategy.resolved_decision.
    limitations:
      - Uses grouped ages rather than single-year ages.
      - Historical files span ICD-8, ICD-9, and ICD-10 eras.
      - Cause-specific analysis requires extra caution across ICD revisions.
      - 2018-2024 files may use different race/population methodology.

data_collection_strategy:
  status: decided_not_yet_built
  decision: Use a single static bulk pull of CDC WONDER data across a fixed, pre-chosen set of discriminating parameters instead of live per-request calls to the CDC WONDER API.
  rationale:
    - CDC WONDER's API is an XML request/response protocol with a different parameter codebook per database, not a simple REST call; not worth the integration cost for a project that only needs an annual data refresh.
    - Suppression of death counts under 10 is applied per query combination; handling it once against a known static pull is far more reliable than re-handling it live for every possible user-selected combination.
    - CDC WONDER mortality data updates roughly annually, so there is no real freshness benefit to querying live.
    - Removes CDC WONDER uptime and rate limits as a failure point during a live demo or interview.
  open_decision: The exact subset of states/causes/demographics for the static pull is not yet chosen. future_reporting_parameters below lists the full aspirational set; recommend narrowing to a small subset (for example 2-3 states, top 4-5 causes of death) for the first working version and expanding later if time allows.
  resolved_decision:
    status: resolved
    date: 2026-09-08
    scope: Applies only to the single-age (1999-2024) dataset. The harmonized 1968-2024 dataset stays general-trend-visualization only and is not part of this state/cause comparison scope — see step_3_holistic_harmonized_model.use_case. Combining both eras for this level of stratified analysis was judged too complicated relative to the benefit.
    chosen:
      - "Locations: United States (baseline) plus California, Texas, Florida, New York — the actual top 4 most populous states per 2024 Census estimates. Illinois (originally listed) was dropped since it is the 6th most populous state, not top 5."
      - "Causes of death: All causes (baseline) plus Heart disease, Cancer, Cerebrovascular disease (stroke), Chronic lower respiratory disease, and COVID-19. The first four are high-volume causes stable across the full 1999-2024 window; COVID-19 is included despite lower average volume because it is the central subject of the cross-subsection comparison this project is built around — its credibility should be judged against its actual 2020-2021 concentration, not averaged across the full panel."
    age_floor_by_cause:
      date: 2026-09-16
      rationale: "These five causes (COVID-19 aside) are diseases of aging — incidence rises steeply with age by underlying epidemiology, not as an artifact of how the data was pulled. A uniform age floor across all five either wastes credibility headroom (heart disease/cancer are meaningful earlier) or still overreaches (stroke/COPD are genuinely rare before the mid-50s). This affects only the state/cause dashboard and API display layer — it does not change workflow.step_2_modern_single_age_model's Lee-Carter/Poisson Lee-Carter fit, which stays national, all-cause, and 20-84 (age_handling.primary_model_ages), an entirely separate pipeline and dataset."
      floors:
        - "All causes: 20-84 (unchanged, already credible at this range nationally)."
        - "Heart disease: 45-84 — meaningful incidence by the 40s, especially male."
        - "Cancer: 45-84 — several major cancers already screened starting around this age; real incidence by then."
        - "Cerebrovascular disease (stroke): 55-84 — incidence rises much more sharply after the mid-50s; rare below that."
        - "Chronic lower respiratory disease (COPD): 55-84 — tied to decades of cumulative exposure; very rare before 50s."
        - "COVID-19: 55-84 for state-level credibility, though some middle-age (45-54) divergence signal may survive at the national level; fatality risk scaled steeply with age and comorbidity."
    deferred:
      - "Diabetes, Alzheimer's disease: back-of-envelope volume estimates suggest these would suppress heavily once crossed with state and single-year age across the full 20-84 range, similar to the suicide/drug-induced example that originally motivated this deferral (see young_adult_mortality_expansion below for those). Diabetes and Alzheimer's are age-of-onset-late diseases like the chosen five, though, so a future expansion would use a similar 55-84-ish floor rather than the full age range, not the 20-44 floor used for the young-adult causes. Deferred as future work, not rejected outright."
      - "Hispanic origin: carries a documented data-quality concern independent of sample size — Hispanic origin on US death certificates is typically informant-reported rather than self-reported, a known contributor to the 'Hispanic mortality paradox' literature. Deferred, not rejected outright."
    narrowed_further:
      date: 2026-09-15
      change: "Race dropped from scope entirely (had been chosen on 2026-09-08 as an isolated Location x All-causes demographic tier, the 4-group Bridged Race scheme). Not a data-quality finding — a deliberate scope cut. The state/cause comparison scope is now exactly two crossed dimensions: Location x Sex x Cause of death, single-age (1999-2024) dataset only."
    young_adult_mortality_expansion:
      status: identified_not_yet_pulled
      date: 2026-09-16
      rationale: "The chosen five causes are diseases of aging and were never going to be credible at ages 20-44 regardless of age-banding — that's real epidemiology, not a suppression artifact to route around. Actuaries do care about working-age mortality (pension/Social Security valuation needs mortality across the full working-age range, and SOA/academic research on 'deaths of despair' has made young-adult mortality a live actuarial topic over the last decade), but through a different cause lens than chronic disease. Pairing cause to the age range where it actually dominates resolves the credibility problem on both ends instead of forcing one cause list across the whole age spectrum."
      candidate_causes:
        - "Drug-induced deaths (overdose) — the single most actuarially significant US mortality trend of the past 15 years for working-age adults; ties directly into the opioid epidemic 2015-2019 context note already planned for ai_reporting's curated corpus."
        - "Suicide — large, well-documented state-level and sex variation; a strong comparison subject on its own."
        - "Unintentional injuries/accidents — broader than overdose alone (includes motor vehicle deaths); historically the leading cause of death under ~45 before overdose overtook it in recent years, so the crossover itself is a real story. Note this overlaps with drug-induced deaths (many overdoses are classified as unintentional injuries) — fine to show both as separate lines, not to be summed as independent components of one total."
        - "Homicide (assault) — optional; also concentrated in younger ages with real state variation, but more sensitive to present publicly than the other three. Consider leaving as a documented 'considered, not included' note rather than building it, unless there's a clear reason to."
      suggested_age_range: "20-44, possibly extending to 54. This is the range where these specific causes are the actual leading drivers of death, so counts should be large rather than suppressed — the inverse problem from the chosen five."
      wonder_ui_note: "These causes live in a different part of the CDC WONDER request form than the ICD-10 113 Cause List used for the chosen five — drug-induced deaths are under a separate 'Drug/Alcohol Induced Causes' selector, and suicide/homicide/accidents are under an 'Injury Intent and Mechanism' selector."
      sex_note: "Sex is worth keeping as a full dimension here specifically because the differential is large and actuarially well-known — male suicide/overdose/accident rates run multiples of female rates."

api_layer:
  status: scaffolded_not_implemented
  location: src/api/ (main.py, schemas.py)
  decision: Build a small self-hosted API (FastAPI) that filters the static processed single-age (1999-2024) dataset and model outputs by state, sex, cause of death, age range, and year, rather than proxying live to CDC WONDER. The harmonized 1968-2024 dataset is served separately for general historic-trend endpoints only, not through these subsection filters.
  purpose: Serve subsection queries to the Streamlit dashboard and to the LLM reporting layer, so both consume the same filtered data instead of duplicating query logic.
  credibility_gate:
    status: planned
    purpose: Prevent the API from silently returning a misleading rate/trend for a filter combination whose underlying cell counts are too small to trust.
    mechanism:
      - "Hard floor: CDC WONDER's own under-10 suppression. A requested cell that comes back suppressed (NaN after cleaning) is reported as 'Suppressed by CDC WONDER (fewer than 10 deaths) - not available', not silently propagated through the life table or model."
      - "Soft floor: a project-defined minimum expected-death-count threshold, above CDC's hard suppression floor but still too small for a stable single-year-age or Poisson Lee-Carter fit; requests landing below it are flagged 'Low credibility - small sample' rather than presented as an equally reliable statistic. The underlying actuarial concept is limited fluctuation/partial credibility weighting (Z = sqrt(n / n_full)), not an arbitrary cutoff. A full partial-credibility weighting scheme (blending a low-credibility cell toward a broader baseline instead of just flagging it) is a stretch goal beyond this initial gate. See age_banding_design below for how this soft floor is actually implemented for the state/cause cross-tab specifically."
      - "Applies to any state x cause x age x sex x year combination requested through the API, not only the ones anticipated during scoping."
    age_banding_design:
      status: planned
      date: 2026-09-15
      standard: Classical Limited Fluctuation Credibility for claim counts requires roughly 1,082 expected claims for full credibility (Poisson assumption, +/-5% margin at 90% confidence); Z = sqrt(n / n_full) gives partial credibility below that.
      key_insight: Mortality rate rises steeply with age (Gompertz), so for a fixed state/sex/cause, absolute death counts are often larger at older ages despite a smaller population at risk — the rate effect dominates. This means credible age-bucket width should vary inversely with age, not be fixed globally — younger ages need wider aggregation, older ages can often stay at single-year resolution where the common causes in the larger states already clear full credibility. A single global age cutoff either wastes real signal at ages where a given slice is actually credible, or still under-covers ages where it is not.
      per_sublevel_variation: The credible age resolution must be decided independently per (state, sex, cause) combination, not once globally — population size (state) and disease frequency (cause) each change how much data volume exists at a given age. National (all 4 states combined) x All Causes is credible at single-year age almost everywhere; a single state x a single disease (especially the rarer of the five chosen causes, e.g. cerebrovascular disease or chronic lower respiratory disease) needs real banding, more so in the smaller of the four states and at younger ages.
      resolved_scheme:
        date: 2026-09-15
        decision: "Binary choice per (state, sex, cause) combination rather than a swept set of candidate bucket widths: single-year age, or the existing harmonized grouped-age scheme already implemented in harmonization.py (map_single_age), restricted to the bins that fall inside the 20-84 modeling range: 20-24, 25-34, 35-44, 45-54, 55-64, 65-74, 75-84. Chosen over a custom width sweep because it reuses already-implemented, already-tested binning logic instead of new candidate-width code."
        testing_grid: "Location (5: US, California, Texas, Florida, New York) x Sex (3: Male, Female, Total) x Cause of death (6: All causes, Heart disease, Cancer, Cerebrovascular disease, Chronic lower respiratory disease, COVID-19) = 90 combinations, each evaluated for whether single-year age clears the soft-floor threshold or must fall back to the 7-bin harmonized grouping, within that cause's own age_floor_by_cause range rather than the full 20-84 (e.g. Heart disease/Cancer only need testing from 45-84; Cerebrovascular disease/COPD/COVID-19 only from 55-84). The 15 All-causes combinations (5 locations x 3 sexes, full 20-84) are expected to clear single-year credibility everywhere, matching the existing national all-cause file; the 75 individual-disease combinations, now restricted to their own credible floor rather than 20-84, are a substantially smaller testing burden than originally scoped."
        known_limitation: "Even within each cause's own floor, the youngest surviving band (e.g. the 45-54 or 55-64 harmonized bin) may still fail credibility for the rarer of the five causes (cerebrovascular disease, COPD) in the smallest of the four states. Those specific (state, sex, cause) combinations are expected to remain flagged as not viable at either supported resolution at that age; that is treated as a correct, honest outcome rather than a gap requiring a third custom bucket width. See data_collection_strategy.resolved_decision.young_adult_mortality_expansion for why ages below each cause's floor were dropped from this grid entirely rather than banded around — they reflect genuinely low incidence for these five causes, not a suppression artifact."
      planned_mechanism:
        - "An offline precompute step (not a live API/dashboard calculation) evaluates each (state, sex, cause) combination against the two resolved_scheme options above."
        - "It materializes the two pre-aggregated tables (single-year and the 7-bin harmonized grouping), plus one small lookup table mapping each filter combination to whichever of the two is credible for it."
        - "The API, dashboard, and LLM reporting layer all consult this same lookup table rather than each computing credibility independently, keeping the logic centralized, testable outside the UI layer, and fast at render time (no live credibility math per interaction)."
      dashboard_feasibility_note: Streamlit (or any reactive dashboard framework) handles this without difficulty — selecting a filter combination triggers a lookup against the small credibility table and a pull of the correspondingly pre-aggregated data, the same reactive pattern as any other filter-driven rerender; st.cache_data on the load/aggregation functions keeps repeated reruns fast. This is a data-design question, not a UI limitation.
    surfaced_in: The dashboard shows a suppressed or low-credibility combination as an explicit message in place of a chart, never a broken or silently misleading one; the LLM reporting layer must never narrate a statistic from a suppressed or flagged-low-credibility cell as if it were reliable.

dashboard_strategy:
  status: planned
  primary:
    tool: Streamlit
    reason: Python-native, integrates directly with the API and the LLM reporting layer, deployable free with a live public link for the resume.
    scope: Two views reflecting the two-tier dataset design. (1) A general historic trend view on the harmonized 1968-2024 dataset, national only, no cause stratification — absorbs step 1's originally-scoped mini dashboard (life expectancy/survival KPIs, year filter) instead of building that twice. (2) A detailed subsection comparison view on the single-age 1999-2024 dataset only, with interactive filters for state, sex, cause of death, age, and year. Both views defer to api_layer.credibility_gate — a filter combination that is CDC-suppressed or below the low-credibility threshold renders as an explicit message in place of a chart, not a broken or misleading one. View (2)'s age axis granularity is not fixed — it adapts per selected filter combination per api_layer.credibility_gate.age_banding_design (single-year age, or the 7-bin harmonized grouping, whichever is credible for that combination), driven by a precomputed lookup table rather than live calculation. Also includes an AI Insight panel powered by ai_reporting.
  secondary:
    tool: Power BI
    reason: The tool actuaries and insurers actually use day to day; demonstrates industry fluency with DAX measures and executive-style KPI dashboards.
    scope: Static dashboard built from precomputed model outputs (life expectancy trend, mortality improvement, kt forecast); shipped as screenshots/a short recording plus the .pbix file, not required to be live-hosted.
  optional:
    tool: Tableau
    reason: Only worth building with time left over; skipping it entirely does not weaken the project.
    scope: If built, a single Tableau Public viz, not a full app.

ai_reporting:
  status: planned
  purpose: Generate plain-English commentary and reports for a user-selected subsection (state, sex, cause of death, age range, year), grounded in the project's own computed statistics rather than open-ended generation.
  guardrail: The AI/report layer explains statistical outputs that already exist; it must not invent numbers or replace the mortality model. It must also treat any api_layer.credibility_gate-flagged cell (CDC-suppressed or low-credibility) as unavailable, never narrating a number from a suppressed or flagged-low-credibility combination as if it were reliable. All AI-generated text is labeled "AI-generated interpretation - actuarial review required" per quality_bar.ai_review_gate.
  pipeline:
    - Compute the real statistics for the selected subsection in Python (percent change, trend direction, inflection years, which age bands drove the change).
    - Retrieve relevant entries from a small curated context corpus (roughly 15-25 hand-written notes on known historical/epidemiological events, e.g. COVID-19 2020-2021, opioid epidemic 2015-2019, HIV/AIDS 1981-1995) by simple year-range and cause-tag matching; no vector database or embeddings needed at this corpus size.
    - Assemble a prompt containing only the computed statistics and the matched context notes, instructing the model to narrate only the provided facts and to present retrieved context as known background, not as an independently asserted causal claim.
    - Generate the commentary via LLM call, ideally as structured/typed output so it can be inserted programmatically into the dashboard or memo.
    - Evaluate before display: check that any number the model states matches the computed ground truth.
  classification_note: This is a lightweight retrieval-augmented generation (RAG) pipeline, using structured filtering over a small curated corpus rather than live web search or a vector index.
  stretch_goal: Live web search for context beyond the curated corpus, only if time remains; not required for the core deliverable.

