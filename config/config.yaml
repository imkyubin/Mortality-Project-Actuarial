project:
  name: mortality_cdc_wonder
  version: 0.1.0
  description: CDC WONDER mortality modeling portfolio project.

data:
  modern_single_age_file: data/processed/new_1999_2024.csv
  harmonized_file: data/processed/harmonized_1968-2024.csv
  processed_file: data/processed/new_1999_2024.csv
  output_dir: data/outputs

excel_reference:
  workflow_doc: Phase1_Hands_On/Excel/Mortality Table Project Workflow.docx
  workbook: Phase1_Hands_On/Excel/Mortality_Workbook.xlsx
  purpose: Use the Excel workbook as the validation reference for formulas, charts, dashboard metrics, and first modeling examples.
  python_data_source_note: Recreate the Excel workflow from data/processed/new_1999_2024.csv instead of importing the workbook's manually exported CDC WONDER CSV.

outputs:
  tables_dir: data/outputs/tables
  figures_dir: data/outputs/figures
  validation_dir: data/outputs/validation
  models_dir: data/outputs/models
  reports_dir: reports
  report_figures_dir: reports/figures

current_scope:
  description: Initial Python validation scope matching the Excel workbook, filtered from the processed modern single-age dataset.
  years:
    start: 2015
    end: 2020
  ages:
    min: 20
    max: 84
  sex:
    - Female
    - Male
    - Total
  location:
    - United States
  cause_of_death:
    - All causes

workflow:
  step_1_excel_validation:
    description: Reproduce the existing Excel mortality table workflow in Python using a validation slice from the processed modern dataset.
    input_source: data/processed/new_1999_2024.csv
    source_dataset: modern_single_age_file
    filter_rule: Select the workbook validation years and age range from the processed 1999-2024 single-age file instead of importing the manually exported CDC WONDER workbook CSV.
    output_goal: Validate qx, px, lx, dx, Lx, Tx, and ex against the Excel/reference outputs.
    years:
      start: 2015
      end: 2020
    age_basis: single_year_age
    ages:
      min: 20
      max: 84
    excel_alignment:
      cleanup_steps:
        - Treat blank sex values as Total when reproducing the original workbook logic.
        - Keep Year Code, Single-Year Ages Code, Sex Code, Deaths, and Population.
        - Filter to ages 20-84 because age 85+ lacks population exposure.
        - Sort by year, sex, and increasing age before recursive life table calculations.
      life_table_columns:
        qx: Deaths divided by Population.
        px: 1 minus qx.
        lx: Recursive surviving cohort count with l20 equal to the radix.
        dx: qx times lx.
        Lx: lx minus 0.5 times dx, assuming deaths are uniformly distributed within each age interval.
        Tx: Backward recursive sum of Lx from current age through age 84.
        ex: Tx divided by lx.
        cumulative_survival: lx divided by radix.
      validation_outputs:
        - Cleaned validation table for years 2015-2020 and ages 20-84.
        - Life table columns matching the Excel workbook formulas.
        - Comparison table or notes documenting any differences from Excel outputs.
      visualization_outputs:
        - qx line graph by age and sex.
        - log qx or log mx line graph by age and sex.
        - survival curve by age and sex.
        - life expectancy ex line graph by age and sex.
        - death rate distribution.
      excel_alignment:
      starting_model_scope:
        year: 2019
        sex: Female
        rationale: Use a pre-COVID year for the first model example, matching the Excel workflow.
      modeling_sequence:
        - Gompertz model on ln(mx) versus age.
        - Residual plot for observed mx versus fitted Gompertz mx.
        - Moving average graduation using 3-year and 5-year age windows.
        - Mortality improvement tables by year and sex.
        - Makeham model using nonlinear least squares.
        - Whittaker-Henderson graduation using a second-difference roughness penalty.
        - Lee-Carter model using ln(mx) = ax + bx * kt + error.
      forecast_sequence:
        - Calculate delta kt by year.
        - Estimate drift as the mean delta kt.
        - Estimate kt residual standard deviation.
        - Forecast kt with widening confidence intervals.
        - Convert forecast kt back to forecast mortality rates.
      dashboard_outputs:
        - KPI values for life expectancy and survival by selected age, sex, and year.
        - Year filter equivalent to the Excel slicer.

  step_2_modern_single_age_model:
    description: Detailed modern mortality modeling dataset.
    input_source: data/processed/new_1999_2024.csv
    source_dataset: modern_single_age_file
    years:
      start: 1999
      end: 2024
    age_basis: single_year_age
    ages:
      min: 20
      max: 84
    models:
      - lee_carter
      - poisson_lee_carter
    use_case: Primary detailed age-specific mortality modeling and forecasting.
    

  step_3_holistic_harmonized_model:
    description: Long historical model using harmonized CDC age groups.
    input_source: data/processed/harmonized_1968-2024.csv
    source_dataset: harmonized_file
    years:
      start: 1968
      end: 2024
    age_basis: harmonized_grouped_age
    harmonization_rule: Aggregate modern single-year ages to match the older CDC grouped-age structure before fitting models.
    models:
      - lee_carter
      - poisson_lee_carter
    use_case: Long-run mortality trend comparison with reduced age detail.
    limitations:
      - Uses grouped ages rather than single-year ages.
      - Historical files span ICD-8, ICD-9, and ICD-10 eras.
      - Cause-specific analysis requires extra caution across ICD revisions.
      - 2018-2024 files may use different race/population methodology.

active_parameters:
  description: Parameters used by the current Excel-validation and first Python workflow.
  location:
    - United States
  sex:
    - Male
    - Female
    - Total
  age_basis: single_year_age
  ages:
    min: 20
    max: 84
  cause_of_death:
    - All causes

future_reporting_parameters:
  description: Later dashboard/report filters after the expanded datasets are cleaned and validated.
  locations:
    - United States
    - California
    - Texas
    - Florida
    - New York
    - Illinois
  sex:
    - Male
    - Female
    - Total
  cause_of_death:
    - All causes
    - Cancer
    - Heart disease
    - Stroke
    - Diabetes
    - Alzheimer's disease
    - Chronic lower respiratory disease
    - COVID-19
    - Drug-induced deaths
    - External causes/accidents
    - Suicide
  optional_demographics:
    - Race
    - Hispanic origin

age_handling:
  primary_model_ages: 20-84
  younger_ages: Keep available in raw/cleaned data if present, but exclude from the first primary model.
  older_ages: Exclude from rate-based models when population exposure is missing.
  not_stated_age: Exclude from age-specific models and track in validation notes.

quality_bar:
  description: Criteria for making the project strong enough for a prestigious actuarial/data science review.
  end_to_end_run:
    requirement: The project runs from raw CDC WONDER data to final outputs with one command.
    status: planned
    evidence_needed:
      - Reproducible command documented in README.
      - Raw-to-cleaned data pipeline.
      - Model fitting outputs.
      - Dashboard exports.
      - Final report or memo generated from saved model results.
  lee_carter_benchmark:
    requirement: Lee-Carter output is compared against a published benchmark when using comparable data.
    status: planned
    benchmark_source: Human Mortality Database US Lee-Carter or equivalent published mortality benchmark.
    evidence_needed:
      - Document data differences before comparison.
      - Compare ax, bx, and kt where definitions align.
      - Define reasonable tolerance.
      - Explain any material mismatch.
  kt_uncertainty:
    requirement: kt forecasts include correct uncertainty intervals.
    status: planned
    method: Random walk with drift using estimated drift variance.
    evidence_needed:
      - Symmetric intervals around forecast kt.
      - Intervals widen with forecast horizon.
      - Formula documented in forecasting module or report.
  actuarial_memo:
    requirement: At least one output is formatted as a one-page actuarial-style memo.
    status: planned
    required_sections:
      - Purpose and scope.
      - Data and assumptions.
      - Methods.
      - Key results.
      - Limitations.
      - Reliance statement.
      - Actuarial review note.
  ai_review_gate:
    requirement: AI-generated interpretation is explicitly marked as requiring human actuarial review.
    status: planned
    required_language: AI-generated interpretation - actuarial review required before client or external use.
  validation_failure_mode:
    requirement: Validation includes at least one place where the model performs poorly and explains why.
    status: planned
    candidate_failure_mode: Lee-Carter may perform poorly for young adult mortality affected by drug-induced deaths or external causes.
    evidence_needed:
      - Residual plot or error metric showing poor fit.
      - Plain-English diagnosis.
      - Proposed structural fix, such as cause-specific modeling, age segmentation, or cohort/period shock adjustment.

life_table:
  radix: 100000
  qx_method: deaths_divided_by_population
  final_age: 84

modeling:
  main_model: lee_carter
  secondary_model: poisson_lee_carter
  forecast_horizon_years: 10

reporting:
  default_output: reports/mortality_model_report.md
