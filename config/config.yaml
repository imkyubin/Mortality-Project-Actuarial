project:
  name: mortality_cdc_wonder
  version: 0.2.0
  description: CDC WONDER mortality modeling portfolio project.
  resume_goal: Entry-level/intern actuarial portfolio piece demonstrating life table construction, mortality modeling (Lee-Carter family), data engineering, dashboarding, API design, and applied AI engineering with grounded/RAG-based reporting.

data:
  modern_single_age_file: data/processed/new_1999_2024.csv
  harmonized_file: data/processed/harmonized_1968-2024.csv
  processed_file: data/processed/new_1999_2024.csv
  output_dir: data/outputs
  status: raw_to_processed_pipeline_done
  known_data_quality_risk: CDC WONDER suppresses death counts under 10 as non-numeric text. Current cleaning (src/data/cleaning.py) does not yet explicitly detect or document suppressed cells; pd.to_numeric(errors="coerce") silently turns them into NaN, which can propagate through the recursive lx calculation for an entire year/sex group. Needs explicit handling and documentation before step 2, and is a good candidate for quality_bar.validation_failure_mode.

excel_reference:
  workflow_doc: Phase1_Hands_On/Excel/Mortality Table Project Workflow.docx
  workbook: Phase1_Hands_On/Excel/Mortality_Workbook.xlsx
  purpose: Use the Excel workbook as the validation reference for formulas, charts, dashboard metrics, and first modeling examples.
  python_data_source_note: Recreate the Excel workflow from data/processed/new_1999_2024.csv instead of importing the workbook's manually exported CDC WONDER CSV.
  validation_depth: Spot-check one age/sex/year combination against the workbook, not a full reconciliation table. See workflow.step_1_baseline_model_prototype.

outputs:
  tables_dir: data/outputs/tables
  figures_dir: data/outputs/figures
  validation_dir: data/outputs/validation
  models_dir: data/outputs/models
  reports_dir: reports
  report_figures_dir: reports/figures
  status: folders_created_pending_use

current_scope:
  description: Initial Python validation scope matching the Excel workbook, filtered from the processed modern single-age dataset.
  years:
    start: 2015
    end: 2020
  ages:
    min: 20
    max: 84
  sex:
    - Female
    - Male
    - Total
  location:
    - United States
  cause_of_death:
    - All causes

workflow:
  step_1_baseline_model_prototype:
    status: core_logic_complete_in_script_not_yet_refactored
    implementation: scripts/step1_baseline_model_prototype.py
    description: Prototype the full actuarial workflow end-to-end (life table, graduation methods, Lee-Carter, and kt forecast) on a small validation slice before scaling to the full modern dataset in step 2 and the harmonized long history in step 3. Originally framed as pure Excel validation; that is now a minor spot-check rather than the point of this step.
    input_source: data/processed/new_1999_2024.csv
    source_dataset: modern_single_age_file
    filter_rule: Select the workbook validation years and age range from the processed 1999-2024 single-age file instead of importing the manually exported CDC WONDER workbook CSV.
    output_goal: Spot-check qx, px, lx, dx, Lx, Tx, and ex for one age/sex/year against the Excel/reference outputs rather than a full reconciliation; project priority has shifted to the dashboard, API, and LLM-supported reporting layers.
    next_action: Extract the validated functions into src/actuarial/ (life_table.py, graduation.py, lee_carter.py, forecasting.py) so step 2 and step 3 reuse them instead of copy-pasting this script.
    years:
      start: 2015
      end: 2020
    age_basis: single_year_age
    ages:
      min: 20
      max: 84
    life_table_build:
      cleanup_steps:
        - Treat blank sex values as Total when reproducing the original workbook logic.
        - Keep Year Code, Single-Year Ages Code, Sex Code, Deaths, and Population.
        - Filter to ages 20-84 because age 85+ lacks population exposure.
        - Sort by year, sex, and increasing age before recursive life table calculations.
      life_table_columns:
        qx: Deaths divided by Population.
        px: 1 minus qx.
        lx: Recursive surviving cohort count with l20 equal to the radix.
        dx: qx times lx.
        Lx: lx minus 0.5 times dx, assuming deaths are uniformly distributed within each age interval.
        Tx: Backward recursive sum of Lx from current age through age 84.
        ex: Tx divided by lx.
        cumulative_survival: lx divided by radix.
      validation_outputs:
        - Cleaned validation table for years 2015-2020 and ages 20-84.
        - Life table columns matching the Excel workbook formulas.
        - Spot-check qx, lx, and ex for one age/sex/year combination against the Excel workbook; a full comparison table across all years/ages/sexes is deprioritized, not required to consider step 1 complete.
      visualization_outputs:
        - qx line graph by age and sex.
        - log qx or log mx line graph by age and sex.
        - survival curve by age and sex.
        - life expectancy ex line graph by age and sex.
        - death rate distribution.
    modeling_prototype:
      starting_model_scope:
        year: 2019
        sex: Female
        rationale: Use a pre-COVID year for the first model example, matching the Excel workflow.
      modeling_sequence:
        - Gompertz model on ln(mx) versus age.
        - Residual plot for observed mx versus fitted Gompertz mx.
        - Moving average graduation using 3-year and 5-year age windows.
        - Mortality improvement tables by year and sex.
        - Makeham model using nonlinear least squares.
        - Whittaker-Henderson graduation using a second-difference roughness penalty.
        - Lee-Carter model using ln(mx) = ax + bx * kt + error.
      forecast_sequence:
        - Calculate delta kt by year.
        - Estimate drift as the mean delta kt.
        - Estimate kt residual standard deviation.
        - Forecast kt with widening confidence intervals.
        - Convert forecast kt back to forecast mortality rates.

  step_2_modern_single_age_model:
    status: in_progress
    status_note: whittaker_henderson_utility below is done and eda is in progress; the headline models below (lee_carter, poisson_lee_carter) are the active next task and still stub files in src/actuarial/.
    description: The primary, production-quality mortality model. Unlike step 1's deliberately exhaustive prototype toolbox, step 2 intentionally uses only the small set of models an actuary would actually rely on in practice, fit on the full modern single-age dataset.
    input_source: data/processed/new_1999_2024.csv
    source_dataset: modern_single_age_file
    years:
      start: 1999
      end: 2024
    age_basis: single_year_age
    ages:
      min: 20
      max: 84
    models:
      - lee_carter
      - poisson_lee_carter
    model_selection_rationale: Lee-Carter and Poisson Lee-Carter are the two models genuinely used in real-world mortality and longevity work; Poisson Lee-Carter is the correct refinement because it fits deaths as counts against population exposure instead of only pre-smoothed rates. Deliberately excludes step 1's wider toolbox (Gompertz, Makeham, moving-average, Whittaker-Henderson) as this step's headline model, though those remain available as graduation/smoothing utilities where useful.
    engineering_tasks:
      - Handle CDC WONDER suppressed-cell values explicitly (see data.known_data_quality_risk) before fitting; do not let them silently propagate through the life table.
      - Extract and reuse validated logic from scripts/step1_baseline_model_prototype.py into src/actuarial/ instead of duplicating it in a new script.
      - Add unit tests for life table invariants (l0 equals radix, lx non-increasing with age, Tx at the final age equals Lx at the final age).
    validation:
      lee_carter_benchmark: Compare ax, bx, and kt against the Human Mortality Database US Lee-Carter output or an equivalent published benchmark; document data differences and define a tolerance before comparing. See quality_bar.lee_carter_benchmark.
      kt_uncertainty: Random walk with drift; forecast intervals must widen with horizon. See quality_bar.kt_uncertainty.
      out_of_sample_backtest: Fit on a training window (e.g., 1999-2018), forecast kt forward, convert to forecast mortality rates, and compare against actual observed rates in the holdout years (2019-2024). See quality_bar.out_of_sample_backtest.
    use_case: Primary detailed age-specific mortality modeling and forecasting; the model that the dashboard, API, and LLM reporting layers read from.
    whittaker_henderson_utility:
      status: done
      location: src/actuarial/whittaker_henderson.py
      purpose: Reusable Whittaker-Henderson graduation/smoothing utility per model_selection_rationale above (not the step 2 headline model). Extends step 1's single hand-picked year/sex slice into a fit across every year/sex group in the full modern dataset.
      function_list:
        - "_second_difference_matrix(n): roughness-penalty matrix, reused by fit_whittaker_henderson and by the lambda elbow's smoothness term."
        - "fit_whittaker_henderson(df, year, sex_code, lambda_=1, pop_weights='n'): single year/sex fit; the shared building block everything else calls. pop_weights uses population SHARE (Population/Population.sum() within that slice), not raw population counts, so lambda_'s effective meaning doesn't swing wildly between pop_weights='n' and population-weighted."
        - "fit_wh_all(df, lambda_=1, pop_weights='n'): fits every (Year Code, Sex Code) group and concatenates into one long frame; the actual step 2 entry point."
        - "lambda_metrics(df, lambda_grid, pop_weights='n') / plot_lambda_elbow(lambda_df): sweeps lambda_grid across the whole dataset (not one slice) via fit_wh_all, builds a (Lambda, RSS, Smoothness) table, plots the elbow with each point labeled by lambda. RSS is also population-share weighted for the same reason as above."
        - "wh_heatmap(df, sex_code): Year x Age residual heatmap, one call per sex, TwoSlopeNorm(vcenter=0) + diverging colormap. Replaces a per-slice residual line plot across the full 1999-2024 range."
        - "plot_whittaker_fit(whittaker_df): single-slice observed-vs-fitted curve; kept for spot-checking one fit's actual shape."
        - "wh_worst_fit(whittaker_df, n=10, pop_weights='n') / wh_worst_cumdev(whittaker_df, n=10, pop_weights='n'): rank every (Year Code, Sex Code) group by population-share-weighted RSS or by max absolute cumulative deviation, returning the top n as a ranking table. plot_3worst_fit(top_df, whittaker_df, top_k=3) plots the top top_k of whichever ranking table it's given, reusing plot_whittaker_fit per slice."
      superseded_plan:
        - "The originally-planned single-slice plot_cumulative_deviations was never built. Once it became clear manually picking one slice at a time didn't scale to the full dataset, it was replaced by the wh_worst_fit/wh_worst_cumdev ranking layer plus plot_3worst_fit, which automatically selects and plots the worst-fit/most-biased slices instead."
      removed:
        - "plot_whittaker_residual: superseded by the wh_worst_cumdev ranking (directional bias, automatically applied to the worst offenders) rather than a raw single-slice residual scatter."
      resolved_decisions:
        - "Whether lambda_ is fixed across all year/sex groups or allowed to vary per group: resolved as fixed/global — lambda_metrics/plot_lambda_elbow deliberately fit the whole dataset at each candidate lambda_ rather than per-slice, matching how a real graduation table uses one smoothing constant per basis, not one per subgroup."
        - "Population-weight scaling: resolved by normalizing to population share (divide by that slice's own Population.sum()) everywhere pop_weights is used — in the fit itself and in the ranking metrics — rather than raw population counts, which would otherwise both distort cross-group rankings toward high-population groups and change lambda_'s effective meaning depending on pop_weights."
      next_up: scripts/step2_all_dataset_model.py wires this module (and the eda module below) together end to end and is the working reference for how these functions compose. The active next task after this is extracting lee_carter.py and poisson_lee_carter.py (see models above) — both are still stub files.
    eda:
      status: in_progress
      location: src/actuarial/eda.py (planned location was src/eda/; ended up colocated with the other actuarial modules since it needs the same life-table columns)
      distinction_from_visualization: Deliberately kept separate from src/visualization/ (dashboard/export-ready plots). EDA here serves the analyst's own diagnostic understanding and is not necessarily end-user-facing.
      built:
        - "plot_crude_mortality_surface(df, sex_code): raw (pre-graduation) ln(qx) mortality surface, Year x Age, sequential (not diverging) colormap since ln(qx) has no meaningful zero to center on."
        - "plot_progression_eda(df, sex_code, column, start_year=None, gaps=1): mortality curve (column='ln_qx') or survival curve (column='Cumulative Survival') by age, one line per year (thinned via start_year/gaps); handles both single-year and harmonized age bases."
        - "top_n_ex(df, sex_code, df_n=5) / plot_top_ex(df, sex_code, plot_n=3): ranks ages by the slope of their life-expectancy trend over time (np.polyfit), returns/plots the most-improving and most-declining ages automatically rather than requiring a manually picked age."
        - "pct_change_qx(df, sex_code) / plot_pct_heatmap(df, sex_code): year-over-year percent mortality-improvement rate (sign-flipped so positive means improving), pivoted Year x Age, TwoSlopeNorm(vcenter=0) + diverging colormap since improvement is genuinely a positive/negative quantity."
      not_yet_built:
        - "Missingness/suppression heatmap (Year x Age, faceted by sex): flags where Deaths/Population came back NaN after pd.to_numeric(errors='coerce'). Recommended to build first — directly targets data.known_data_quality_risk before any modeling trusts the life table recursion, since one suppressed cell can silently corrupt an entire year/sex group's lx via the cumulative product. Still outstanding; the other plots were built ahead of it in practice."
        - "Sex mortality gap: male vs female qx or ex by age, a well-documented actuarial pattern worth confirming in this dataset."
      dashboard_facing: Life expectancy trend (top_n_ex/plot_top_ex), survival curve and mortality curve (plot_progression_eda), and the mortality improvement heatmap are candidates for dashboard_strategy panels — interpretable to a general viewer under the year/sex/age filters.
      internal_only: The missingness/suppression heatmap (once built) and raw death-count distributions belong in the analyst's own workflow and the actuarial_memo's limitations section, not as live dashboard panels. plot_crude_mortality_surface and wh_heatmap-style residual heatmaps are model-diagnostic tools, not headline dashboard content.

  step_3_holistic_harmonized_model:
    status: planned_after_step_2
    priority_note: Lower priority than the dashboard, API, and LLM reporting layers. Build only if time remains after step 2 and the application layer are done.
    description: Long historical model using harmonized CDC age groups.
    input_source: data/processed/harmonized_1968-2024.csv
    source_dataset: harmonized_file
    years:
      start: 1968
      end: 2024
    age_basis: harmonized_grouped_age
    harmonization_rule: Aggregate modern single-year ages to match the older CDC grouped-age structure before fitting models.
    models:
      - lee_carter
      - poisson_lee_carter
    use_case: Long-run mortality trend comparison with reduced age detail.
    limitations:
      - Uses grouped ages rather than single-year ages.
      - Historical files span ICD-8, ICD-9, and ICD-10 eras.
      - Cause-specific analysis requires extra caution across ICD revisions.
      - 2018-2024 files may use different race/population methodology.

data_collection_strategy:
  status: decided_not_yet_built
  decision: Use a single static bulk pull of CDC WONDER data across a fixed, pre-chosen set of discriminating parameters instead of live per-request calls to the CDC WONDER API.
  rationale:
    - CDC WONDER's API is an XML request/response protocol with a different parameter codebook per database, not a simple REST call; not worth the integration cost for a project that only needs an annual data refresh.
    - Suppression of death counts under 10 is applied per query combination; handling it once against a known static pull is far more reliable than re-handling it live for every possible user-selected combination.
    - CDC WONDER mortality data updates roughly annually, so there is no real freshness benefit to querying live.
    - Removes CDC WONDER uptime and rate limits as a failure point during a live demo or interview.
  open_decision: The exact subset of states/causes/demographics for the static pull is not yet chosen. future_reporting_parameters below lists the full aspirational set; recommend narrowing to a small subset (for example 2-3 states, top 4-5 causes of death) for the first working version and expanding later if time allows.

api_layer:
  status: scaffolded_not_implemented
  location: src/api/ (main.py, schemas.py)
  decision: Build a small self-hosted API (FastAPI) that filters the static processed dataset and model outputs by state, sex, cause of death, age range, and year, rather than proxying live to CDC WONDER.
  purpose: Serve subsection queries to the Streamlit dashboard and to the LLM reporting layer, so both consume the same filtered data instead of duplicating query logic.

dashboard_strategy:
  status: planned
  primary:
    tool: Streamlit
    reason: Python-native, integrates directly with the API and the LLM reporting layer, deployable free with a live public link for the resume.
    scope: Interactive subsection filters (state, sex, cause of death, age, year) plus an AI Insight panel powered by ai_reporting. Also absorbs step 1's originally-scoped mini dashboard (life expectancy/survival KPIs, year filter) instead of building that twice.
  secondary:
    tool: Power BI
    reason: The tool actuaries and insurers actually use day to day; demonstrates industry fluency with DAX measures and executive-style KPI dashboards.
    scope: Static dashboard built from precomputed model outputs (life expectancy trend, mortality improvement, kt forecast); shipped as screenshots/a short recording plus the .pbix file, not required to be live-hosted.
  optional:
    tool: Tableau
    reason: Only worth building with time left over; skipping it entirely does not weaken the project.
    scope: If built, a single Tableau Public viz, not a full app.

ai_reporting:
  status: planned
  purpose: Generate plain-English commentary and reports for a user-selected subsection (state, sex, cause of death, age range, year), grounded in the project's own computed statistics rather than open-ended generation.
  guardrail: The AI/report layer explains statistical outputs that already exist; it must not invent numbers or replace the mortality model. All AI-generated text is labeled "AI-generated interpretation - actuarial review required" per quality_bar.ai_review_gate.
  pipeline:
    - Compute the real statistics for the selected subsection in Python (percent change, trend direction, inflection years, which age bands drove the change).
    - Retrieve relevant entries from a small curated context corpus (roughly 15-25 hand-written notes on known historical/epidemiological events, e.g. COVID-19 2020-2021, opioid epidemic 2015-2019, HIV/AIDS 1981-1995) by simple year-range and cause-tag matching; no vector database or embeddings needed at this corpus size.
    - Assemble a prompt containing only the computed statistics and the matched context notes, instructing the model to narrate only the provided facts and to present retrieved context as known background, not as an independently asserted causal claim.
    - Generate the commentary via LLM call, ideally as structured/typed output so it can be inserted programmatically into the dashboard or memo.
    - Evaluate before display: check that any number the model states matches the computed ground truth.
  classification_note: This is a lightweight retrieval-augmented generation (RAG) pipeline, using structured filtering over a small curated corpus rather than live web search or a vector index.
  stretch_goal: Live web search for context beyond the curated corpus, only if time remains; not required for the core deliverable.

active_parameters:
  description: Parameters used by the current baseline model prototype and first Python workflow.
  location:
    - United States
  sex:
    - Male
    - Female
    - Total
  age_basis: single_year_age
  ages:
    min: 20
    max: 84
  cause_of_death:
    - All causes

future_reporting_parameters:
  description: Later dashboard/API/report filters after the expanded datasets are cleaned and validated.
  scope_note: Full aspirational set. See data_collection_strategy.open_decision for the recommendation to narrow this to a smaller subset for the first working version.
  locations:
    - United States
    - California
    - Texas
    - Florida
    - New York
    - Illinois
